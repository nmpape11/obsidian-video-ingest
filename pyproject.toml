[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-video-ingest"
version = "0.1.0"
description = "Turn saved TikTok/Instagram links in an Obsidian inbox into one note per video."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Stage 2: download captions/audio and transcribe locally.
# curl-cffi lets yt-dlp impersonate a browser; TikTok blocks plain requests.
fetch = ["yt-dlp[curl-cffi]>=2026.8.19", "faster-whisper>=1.1"]

[project.scripts]
video-ingest = "video_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
