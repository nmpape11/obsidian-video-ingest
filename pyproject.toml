[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "obsidian-video-ingest"
version = "0.1.0"
description = "Turn saved TikTok/Instagram links in an Obsidian inbox into one note per video."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Stage 2: download captions/audio and transcribe locally.
# curl-cffi lets yt-dlp impersonate a browser; TikTok blocks plain requests.
# av<19: PyAV 19 dropped av.open(metadata_errors=...), which faster-whisper 1.2 passes.
fetch = ["yt-dlp[curl-cffi]>=2026.8.19", "faster-whisper>=1.1", "av>=11,<19"]
# Stage 2b: read on-screen text from slideshow images and sampled video frames.
# rapidocr doesn't pull in an inference runtime; av decodes frames (same pin as above).
ocr = ["obsidian-video-ingest[fetch]", "rapidocr>=3.9,<4", "onnxruntime>=1.20", "av>=11,<19"]
# Stage 3: summarize/categorize notes with the Claude API (needs ANTHROPIC_API_KEY).
enrich = ["anthropic>=1.9,<2"]
all = ["obsidian-video-ingest[ocr,enrich]"]

[project.scripts]
video-ingest = "video_ingest.cli:main"
video-fetch = "video_ingest.fetch_cli:main"
video-ocr = "video_ingest.ocr_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
