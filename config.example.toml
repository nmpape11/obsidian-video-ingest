# Copy to config.toml (gitignored) and edit. CLI flags override these values.

# Vault root. Point at ./sandbox (a copy) until you trust the pipeline.
vault = "./sandbox"

# Inbox notes, relative to the vault, processed in order.
inboxes = [
  "00 Inbox/tiktok.md",
  "00 Inbox/instagram.md",
]

# Folder that receives one note per video, relative to the vault.
out = "10 Saved Videos"

# Stage 2: video-fetch (pip install -e ".[fetch]")
[fetch]
# tiny | base | small | medium | large-v3. base is ~10s per short clip on CPU;
# small is noticeably more accurate on names/ingredients but ~3x slower.
whisper_model = "base"
# Spoken language code (e.g. "en"); leave empty to auto-detect.
language = ""
# Instagram usually needs logged-in cookies. Export a Netscape cookies.txt
# (gitignored as cookies*.txt) or read them from a local browser profile.
# Note: under WSL, cookies_from_browser can't see Windows browsers; use a file.
cookies_file = ""
cookies_from_browser = ""
# Seconds between videos, to avoid rate limits.
sleep = 2.0

# Stage 2b: video-ocr (pip install -e ".[ocr]"). Reads text from slideshow images
# and from video frames; runs on notes that already have fetch_status: ok.
[ocr]
# Video frames to read per second. 1 catches captions shown for ~1s; ~0.3s per frame.
fps = 1.0
# OCR threads; 0 = min(6, cores). More than ~6 is slower, not faster.
threads = 0
# Drop OCR lines read with lower confidence (0-1).
min_score = 0.8
sleep = 2.0

# Stage 3: video-enrich (pip install -e ".[enrich]", needs ANTHROPIC_API_KEY).
# Sends caption + transcript + on-screen text (no images) to Claude, which fills the
# Summary and Key points, picks categories and tags, and sets processed: true.
[enrich]
# claude-opus-5-5 (default), claude-sonnet-5-5, or claude-haiku-5-5 for lowest cost.
model = "claude-opus-5-5"
# low | medium | high | xhigh | max. low is plenty for summarizing.
effort = "low"
# Categories to offer from the start; ones already used in notes are added automatically.
categories = ["Cooking", "Gym", "Self Help"]
sleep = 0.0
